name: Murk
options:
  bundleIdPrefix: com.rilwan11
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PJVDGVTL4J
targets:
  Murk:
    type: application
    platform: iOS
    sources:
      - Murk
      - Shared
    dependencies:
      - target: MurkWidget
    info:
      path: Murk/Info.plist
      properties:
        CFBundleDisplayName: Murk
        BGTaskSchedulerPermittedIdentifiers:
          - com.rilwan11.murk.refresh
        UIBackgroundModes:
          - fetch
        NSPhotoLibraryAddUsageDescription: "Murk saves weather wallpapers to your Photos."
        NSLocationWhenInUseUsageDescription: "Murk uses your location to retrieve local weather, air quality, and weather alerts."
        MurkWeatherAPIKey: "$(MURK_WEATHER_API_KEY)"
        MurkCloudSync: "$(MURK_ICLOUD_SYNC)"
        CFBundleURLTypes:
          - CFBundleURLName: com.rilwan11.murk
            CFBundleURLSchemes:
              - murk
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Murk/Murk.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rilwan11.murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk
        PRODUCT_NAME: Murk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Murk
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Murk uses your location to retrieve local weather, air quality, and weather alerts."
        SWIFT_OBJC_BRIDGING_HEADER: Murk/Audio/Murk-Bridging-Header.h
        MURK_WEATHER_API_KEY: ""
        # iCloud sync needs the paid developer program: set to YES and add the
        # com.apple.developer.ubiquity-kvstore-identifier entitlement (see docs/APP_STORE.md).
        MURK_ICLOUD_SYNC: "NO"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Aurora AppIcon-Storm AppIcon-Sunset"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  MurkWidget:
    type: app-extension
    platform: iOS
    sources:
      - MurkWidget
      - Shared
      - Murk/Models
      - Murk/Theme
      - Murk/Data
      - Murk/Services/Astronomy.swift
      - Murk/Store/Verdicts.swift
    entitlements:
      path: MurkWidget/MurkWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rilwan11.murk
    info:
      path: MurkWidget/Info.plist
      properties:
        CFBundleDisplayName: Murk
        MurkWeatherAPIKey: "$(MURK_WEATHER_API_KEY)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.widget
        PRODUCT_NAME: MurkWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        MURK_WEATHER_API_KEY: ""

  MurkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MurkTests
    dependencies:
      - target: Murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.tests
        GENERATE_INFOPLIST_FILE: YES

  # Apple Watch: a standalone app (it doesn't ride along with the iPhone install, so iPhone builds
  # and free signing are unaffected). Build and run it with the MurkWatch scheme.
  MurkWatch:
    type: application
    platform: watchOS
    sources:
      - MurkWatch
      - MurkWatchShared
      - Murk/Models
      - Murk/Data/WeatherAPI.swift
      - Murk/Services/Astronomy.swift
      - Murk/Store/Verdicts.swift
      - Shared/MoonImage.swift
      - Shared/MoonSurface.swift
    dependencies:
      - target: MurkWatchWidget
    info:
      path: MurkWatch/Info.plist
      properties:
        CFBundleDisplayName: Murk
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: "Murk uses your location to show the weather where you are."
        MurkWeatherAPIKey: "$(MURK_WEATHER_API_KEY)"
    entitlements:
      path: MurkWatch/MurkWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rilwan11.murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.watch
        PRODUCT_NAME: Murk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MURK_WEATHER_API_KEY: ""

  MurkWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - MurkWatchWidget
      - MurkWatchShared
      - Murk/Models
      - Murk/Data/WeatherAPI.swift
      - Murk/Services/Astronomy.swift
      - Murk/Store/Verdicts.swift
      - Shared/MoonImage.swift
      - Shared/MoonSurface.swift
    info:
      path: MurkWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Murk
        MurkWeatherAPIKey: "$(MURK_WEATHER_API_KEY)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MurkWatchWidget/MurkWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rilwan11.murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.watch.widget
        PRODUCT_NAME: MurkWatchWidget
        SKIP_INSTALL: YES
        MURK_WEATHER_API_KEY: ""

  # Draws the widgets from a sample forecast; fails the build if one comes out blank.
  MurkWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MurkWidget
        excludes:
          - MurkWidgetBundle.swift
          - Info.plist
          - MurkWidget.entitlements
          - PrivacyInfo.xcprivacy
      - Shared
      - Murk/Models
      - Murk/Theme
      - Murk/Data
      - Murk/Services/Astronomy.swift
      - Murk/Store/Verdicts.swift
      - MurkWidgetTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.widgettests
        GENERATE_INFOPLIST_FILE: YES

  MurkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MurkUITests
    dependencies:
      - target: Murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Murk:
    build:
      targets:
        Murk: all
        MurkWidget: all
        MurkWidgetTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Murk/Murk.storekit
    test:
      config: Debug
      targets:
        - MurkTests
        - MurkWidgetTests
    archive:
      config: Release
  MurkUITests:
    build:
      targets:
        Murk: all
        MurkWidget: all
        MurkUITests: [test]
    test:
      config: Debug
      targets:
        - MurkUITests
  MurkWatch:
    build:
      targets:
        MurkWatch: all
        MurkWatchWidget: all
    run:
      config: Debug
    archive:
      config: Release
