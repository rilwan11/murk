name: Murk
options:
  bundleIdPrefix: com.rilwan11
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PJVDGVTL4J
targets:
  Murk:
    type: application
    platform: iOS
    sources:
      - Murk
      - Shared
    dependencies:
      - target: MurkWidget
    info:
      path: Murk/Info.plist
      properties:
        CFBundleDisplayName: Murk
        BGTaskSchedulerPermittedIdentifiers:
          - com.rilwan11.murk.refresh
        UIBackgroundModes:
          - fetch
        NSPhotoLibraryAddUsageDescription: "Murk saves weather wallpapers to your Photos."
        NSLocationWhenInUseUsageDescription: "Murk uses your location to retrieve local weather, air quality, and weather alerts."
        MurkWeatherAPIKey: "$(MURK_WEATHER_API_KEY)"
        CFBundleURLTypes:
          - CFBundleURLName: com.rilwan11.murk
            CFBundleURLSchemes:
              - murk
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Murk/Murk.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rilwan11.murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk
        PRODUCT_NAME: Murk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Murk
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Murk uses your location to retrieve local weather, air quality, and weather alerts."
        SWIFT_OBJC_BRIDGING_HEADER: Murk/Audio/Murk-Bridging-Header.h
        MURK_WEATHER_API_KEY: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  MurkWidget:
    type: app-extension
    platform: iOS
    sources:
      - MurkWidget
      - Shared
      - Murk/Models
      - Murk/Theme
      - Murk/Data
      - Murk/Services/Astronomy.swift
    entitlements:
      path: MurkWidget/MurkWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rilwan11.murk
    info:
      path: MurkWidget/Info.plist
      properties:
        CFBundleDisplayName: Murk
        MurkWeatherAPIKey: "$(MURK_WEATHER_API_KEY)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.widget
        PRODUCT_NAME: MurkWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        MURK_WEATHER_API_KEY: ""

  MurkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MurkTests
    dependencies:
      - target: Murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.tests
        GENERATE_INFOPLIST_FILE: YES

  MurkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MurkUITests
    dependencies:
      - target: Murk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilwan11.murk.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Murk:
    build:
      targets:
        Murk: all
        MurkWidget: all
    run:
      config: Debug
      storeKitConfiguration: Murk/Murk.storekit
    test:
      config: Debug
      targets:
        - MurkTests
    archive:
      config: Release
  MurkUITests:
    build:
      targets:
        Murk: all
        MurkWidget: all
        MurkUITests: [test]
    test:
      config: Debug
      targets:
        - MurkUITests
